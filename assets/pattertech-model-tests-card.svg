<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">PatterTech model tests</title>
  <desc id="desc">A branded social card for practical model tests with comparable prompts and outputs.</desc>
  <defs>
    <radialGradient id="bg" cx="74%" cy="43%" r="76%">
      <stop offset="0" stop-color="#102a3d"/>
      <stop offset=".46" stop-color="#081521"/>
      <stop offset="1" stop-color="#05080d"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f2fdff"/>
      <stop offset=".28" stop-color="#7be9ff"/>
      <stop offset=".7" stop-color="#33ddff"/>
      <stop offset="1" stop-color="#00a1e6"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33ddff"/>
      <stop offset="1" stop-color="#0071c2"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="855" cy="300" r="220" fill="#00bfff0c" filter="url(#soft)"/>
  <g opacity=".42" fill="#dff6ff">
    <circle cx="664" cy="96" r="1.4"/><circle cx="748" cy="168" r="1"/><circle cx="1026" cy="96" r="1.2"/><circle cx="1112" cy="230" r="1.5"/><circle cx="1050" cy="480" r="1"/><circle cx="745" cy="513" r="1.3"/><circle cx="941" cy="541" r="1"/><circle cx="1111" cy="391" r=".8"/>
  </g>
  <g transform="translate(100 92)">
    <g transform="translate(0 0)">
      <circle cx="32" cy="32" r="27" fill="none" stroke="url(#ring)" stroke-width="1.5" opacity=".55"/>
      <circle cx="32" cy="32" r="19.5" fill="none" stroke="url(#ring)" stroke-width="1.75" opacity=".75"/>
      <circle cx="32" cy="32" r="12" fill="none" stroke="url(#ring)" stroke-width="2"/>
      <circle cx="32" cy="32" r="5.5" fill="url(#core)" filter="url(#glow)"/>
    </g>
    <text x="82" y="40" fill="#33ddff" font-family="Arial, sans-serif" font-size="29" font-weight="700" letter-spacing="-.8">Patter</text><text x="173" y="40" fill="#eaf2f8" font-family="Arial, sans-serif" font-size="29" font-weight="700" letter-spacing="-.8">Tech</text>
  </g>
  <g transform="translate(858 303) rotate(-19)" fill="none">
    <ellipse rx="253" ry="103" stroke="#00bfff" stroke-width="2" opacity=".62"/>
    <ellipse rx="189" ry="72" stroke="#33ddff" stroke-width="1" opacity=".34"/>
    <ellipse rx="135" ry="48" stroke="#18293a" stroke-width="1"/>
    <circle r="11" fill="url(#core)" stroke="#dff6ff" stroke-width="2" filter="url(#glow)"/>
    <circle cx="210" cy="-20" r="6" fill="#33ddff" stroke="none"/><circle cx="-156" cy="16" r="5" fill="#ffce7a" stroke="none"/>
  </g>
  <g transform="translate(100 252)">
    <text x="0" y="0" fill="#00bfff" font-family="Consolas, monospace" font-size="14" letter-spacing="3">PATTERTECH / MODEL TESTS</text>
    <text x="0" y="85" fill="#eaf2f8" font-family="Arial, sans-serif" font-size="72" font-weight="600" letter-spacing="-2.5">Model Tests</text>
    <text x="0" y="132" fill="#c9d6e0" font-family="Arial, sans-serif" font-size="27" letter-spacing=".2">Practical prompts. Comparable outputs.</text>
    <rect x="0" y="179" width="410" height="1" fill="#18293a"/><text x="0" y="214" fill="#8aa0b4" font-family="Consolas, monospace" font-size="13" letter-spacing="2">PROMPTS · OUTPUTS · COMPARISONS</text>
  </g>
  <path d="M100 552H1100" stroke="#18293a"/><text x="100" y="584" fill="#8aa0b4" font-family="Consolas, monospace" font-size="12" letter-spacing="2">DANIEL PARKE  /  daniel-parke.github.io/model-tests</text>
</svg>
